# Entrées de menu FR. Renseignées une fois les gabarits top-bar/footer construits.
#
# Mêmes identifiants/poids que menus.en.toml (voir ce fichier pour le
# commentaire d'ensemble, notamment sur `pageRef` vs `url`). Les `pageRef`
# ci-dessous ne portent PAS le préfixe `/fr-fr/` : dans un fichier de menu
# par langue, Hugo résout `pageRef` dans le contexte de CETTE langue, donc
# le chemin logique du contenu suffit (ex. "/pricing/" trouve
# `pricing.fr-fr.md`) — l'URL générée porte bien le préfixe
# (`defaultContentLanguageInSubdir = false` place l'anglais à la racine).

