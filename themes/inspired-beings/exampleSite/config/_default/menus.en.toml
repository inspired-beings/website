# EN menu entries. Populated once the top-bar/footer layouts are built.
#
# `main` drives the top-bar (Task 3); the six `services-*` entries share
# `parent = "services"`, making "Services" the APG-disclosure dropdown
# trigger — it has no `url` of its own (button-only, not a page link).
# `main` deliberately stays to primary sections only (home/services/pricing/
# about/news/contact); faq/careers/products/legal (all shipped by Task 11)
# are secondary pages, reachable via the footer columns below only — same
# precedent as `faq`, which was never added to `main` either.

[[menus.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menus.main]]
  identifier = "services"
  name = "Services"
  weight = 20

[[menus.main]]
  identifier = "services-web-development"
  name = "Web & App Development"
  url = "/services/web-development/"
  parent = "services"
  weight = 10

[[menus.main]]
