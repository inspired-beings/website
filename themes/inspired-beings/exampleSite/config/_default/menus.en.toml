# `footercompany` / `footerservices` / `footerresources` drive the footer's
# three nav columns (Task 3). Lowercase-only: Hugo lowercases menu config
# keys, and Go template dotted field access (`.Site.Menus.foo`) is
# case-sensitive, so a camelCase name here would be unreachable from the
# partial.

