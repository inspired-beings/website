# EN menu entries. Populated once the top-bar/footer layouts are built.
#
# `main` drives the top-bar (Task 3); the six `services-*` entries share
# `parent = "services"`, making "Services" the APG-disclosure dropdown
# trigger — it has no `url` of its own (button-only, not a page link).
# Target pages for services/pricing/about/news/contact/careers/faq/products
# don't exist yet (later tasks add them) — the routes are placeholders.

[[menus.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menus.main]]
  identifier = "services"
  name = "Services"
  weight = 20

[[menus.main]]
  identifier = "services-web-app-development"
  name = "Web & App Development"
  url = "/services/web-app-development/"
  parent = "services"
  weight = 10

