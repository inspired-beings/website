# Hugo's sandboxed PostCSS requires node_modules/.bin/postcss to be a Node.js
# script; pnpm's default sh shims break it.
preferSymlinkedExecutables: true
# puppeteer's postinstall (browser download) must run or pnpm run hard-fails
# with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  puppeteer: true
# Dependabot-flagged transitives pinned too tightly by serve/compression — drop
# each override once upstream moves past the patched version.
overrides:
  'ajv@>=7.0.0 <8.18.0': 8.20.0
  'minimatch@<3.1.4': 3.1.5
  'on-headers@<1.1.0': 1.1.0
