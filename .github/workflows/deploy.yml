name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.162.1'
  HUGO_SHA256: 'e34160095b6a6406af857fe212f50e4451f67ed1276b9bb0de13d08754980118'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Hugo (extended)
        run: |
          curl -sfLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.5.3.cjs install --immutable
      - name: Build
        run: node .yarn/releases/yarn-4.5.3.cjs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
